version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: repointel_db
    environment:
      POSTGRES_DB: repointel
      POSTGRES_USER: naresh
      POSTGRES_PASSWORD: nareshpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naresh -d repointel"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    image: python:3.9-slim
    container_name: repointel_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow && 
             mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repointel_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://naresh:nareshpassword@db:5432/repointel
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - JWT_SECRET=engineering-intelligence-secret-key-12345
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repointel_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_data:
